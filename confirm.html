<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Booking Confirmation | The Doctor Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF9F6; --paper:#FFFFFF; --ink:#142328; --ink-2:#3B4A4F; --ink-3:#6B7478;
    --coral:#F76747; --green:#2F5D46; --green-soft:#E5EEE8; --rule:#E6E2DA; --error:#B23B21;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--cream);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 16px 80px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px;}
  /* Same markup + styles as the logo on thedoctornetwork.com.au */
  .wordmark{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600;letter-spacing:-.04em;display:inline-flex;align-items:center;white-space:nowrap;line-height:1;color:var(--ink);text-decoration:none;}
  .doctor-mid{position:relative;display:inline-flex;align-items:baseline}
  .eye{color:var(--coral)}
  .logo-smile{position:absolute;left:3px;right:3px;bottom:-15px;width:calc(100% - 6px);height:19px;overflow:visible;pointer-events:none}
  .logo-smile path{fill:none;stroke:var(--coral);stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
  @media (max-width:560px){ .wordmark{font-size:23px} .logo-smile{bottom:-12px} }
  .secure{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;}
  h1{font-family:Fredoka,Manrope,sans-serif;font-weight:600;font-size:clamp(25px,4.6vw,34px);line-height:1.15;margin:0 0 8px;letter-spacing:-.01em;}
  .lead{color:var(--ink-2);margin:0 0 22px;}
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:28px clamp(18px,4vw,34px);margin-bottom:20px;}
  .letter p{margin:0 0 12px;color:var(--ink-2);}
  .letter b, .letter strong{color:var(--ink);}
  .accept-card h2{font-family:Fredoka,Manrope,sans-serif;font-weight:600;font-size:22px;margin:0 0 6px;}
  label.field{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:16px 0 6px;}
  input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--cream);}
  input[type=text]:focus{outline:none;border-color:var(--green);background:#fff;}
  .agree{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--cream);border:1.5px solid var(--rule);cursor:pointer;font-size:14.5px;color:var(--ink-2);}
  .agree input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;width:100%;padding:15px 22px;border:none;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;}
  .btn[disabled]{opacity:.55;cursor:not-allowed;}
  .error{color:var(--error);font-size:14px;margin-top:12px;min-height:1em;}
  .done{display:flex;gap:14px;align-items:flex-start;background:var(--green-soft);border:1px solid #C7DACE;}
  .tick{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:20px;}
  .muted{color:var(--ink-3);font-size:13px;}
  .loading{color:var(--ink-3);text-align:center;padding:60px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="wordmark" href="https://thedoctornetwork.com.au" aria-label="The Doctor Network home">
      <span>The D</span><span class="doctor-mid"><span class="eye">o</span><span>c</span><span>t</span><span class="eye">o</span>
      <svg class="logo-smile" viewBox="0 0 100 34" aria-hidden="true"><path d="M5 7 Q50 32 95 7"/></svg></span><span>r Network</span>
    </a>
    <div class="secure"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Private confirmation link</div>
  </div>
  <div id="app"><div class="loading">Loading your booking confirmation...</div></div>
</div>
<script>
var API_BASE = "https://vgavcmazlmgflyqlmbns.supabase.co/functions/v1/placement-confirm-portal";
var token = new URLSearchParams(location.search).get("token") || "";
var app = document.getElementById("app");
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(iso){
  try { return new Date(iso).toLocaleString("en-AU", { day:"numeric", month:"long", year:"numeric", hour:"numeric", minute:"2-digit" }); }
  catch (e){ return iso; }
}
function render(d){
  var accepted = d.status === "accepted";
  var html = '<h1>'+esc(d.subject)+'</h1>'+
    '<p class="lead">'+(accepted ? "This booking has been accepted. Thank you!" : "Please read the confirmation below, then accept the booking at the bottom of this page.")+'</p>';
  if (accepted){
    html += '<div class="card done"><span class="tick">&#10003;</span><div><strong>Accepted by '+esc(d.acceptedName)+'</strong><div class="muted">'+esc(fmt(d.acceptedAt))+'. '+esc(d.agencyName)+' has been notified.</div></div></div>';
  }
  html += '<div class="card letter">'+d.bodyHtml+'</div>';
  if (!accepted){
    html += '<div class="card accept-card"><h2>Accept this booking</h2>'+
      '<div class="muted">Type your full name to confirm. We\'ll record the date and time you accepted.</div>'+
      '<label class="field" for="nm">Full name</label><input type="text" id="nm" autocomplete="name" value="'+esc(d.toName)+'" />'+
      '<label class="agree"><input type="checkbox" id="ag" /> <span>I have read this confirmation and accept the booking on these terms'+(d.party === "client" ? ", in conjunction with " + esc(d.agencyName) + "'s Terms of Business" : "")+'.</span></label>'+
      '<button class="btn" id="go" type="button">Accept booking</button><div class="error" id="err"></div></div>';
  }
  app.innerHTML = html;
  if (!accepted){
    document.getElementById("go").addEventListener("click", function(){
      var btn = this, err = document.getElementById("err");
      var name = document.getElementById("nm").value.trim(), agree = document.getElementById("ag").checked;
      err.textContent = "";
      if (name.length < 2){ err.textContent = "Please type your full name."; return; }
      if (!agree){ err.textContent = "Please tick the box to confirm."; return; }
      btn.disabled = true; btn.textContent = "Accepting...";
      fetch(API_BASE + "?token=" + encodeURIComponent(token), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ name: name, agree: true }) })
        .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
        .then(function(res){
          if (!res.ok){ btn.disabled = false; btn.textContent = "Accept booking"; err.textContent = res.j.error || "Something went wrong - please try again."; return; }
          render(res.j); window.scrollTo({ top: 0, behavior: "smooth" });
        })
        .catch(function(){ btn.disabled = false; btn.textContent = "Accept booking"; err.textContent = "Couldn't connect - please check your internet and try again."; });
    });
  }
}
if (!token){ app.innerHTML = '<div class="card"><p>This link is missing its code. Please use the button in your email.</p></div>'; }
else {
  fetch(API_BASE + "?token=" + encodeURIComponent(token))
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if (!res.ok){ app.innerHTML = '<div class="card"><p>'+esc(res.j.error || "This link isn't valid.")+'</p><p class="muted">If you think this is a mistake, reply to the email you received.</p></div>'; return; }
      render(res.j);
    })
    .catch(function(){ app.innerHTML = '<div class="card"><p>Couldn\'t load your confirmation - please check your internet and refresh.</p></div>'; });
}
</script>
</body>
</html>
