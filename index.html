<style>
:root{
  --paper-0:#FFFFFF;
  --paper-50:#F6F8FD;
  --paper-100:#EAF0FB;
  --line:#E1E7F2;
  --ink-900:#202A3A;
  --ink-600:#57607A;
  --ink-400:#8890A6;
  --teal-700:#0F766E;
  --teal-600:#14B8A6;
  --teal-100:#CCFBF1;
  --amber-600:#D97706;
  --amber-100:#FEF3C7;
  --rust-600:#E11D48;
  --rust-100:#FFE1E7;
  --green-600:#16A34A;
  --green-100:#DCFCE7;
  --slate-100:#EEF1F7;
  --slate-600:#667085;
  --on-accent:#FFFFFF;
  --accent-a:#14B8A6;
  --accent-b:#8B5CF6;
  --shadow: 0 1px 2px rgba(32,42,58,0.06), 0 6px 20px rgba(32,42,58,0.08);
  color-scheme: light;
}
/* Roster always uses the Cool White palette above, regardless of the viewer's
   system/browser dark-mode setting. The block below only applies if data-theme="dark"
   is explicitly set (not currently exposed in the UI), so a future manual toggle
   could still opt in to dark mode without the app defaulting to it automatically. */
:root[data-theme="dark"]{
  --paper-0:#12181D;
  --paper-50:#182029;
  --paper-100:#1F2932;
  --line:#2C3843;
  --ink-900:#F2EFE7;
  --ink-600:#A9B2BA;
  --ink-400:#74808B;
  --teal-700:#7FCCC4;
  --teal-600:#4FB3A9;
  --teal-100:#1C3A38;
  --amber-600:#E0A542;
  --amber-100:#3A2E17;
  --rust-600:#E08064;
  --rust-100:#3B241C;
  --green-600:#6FC79A;
  --green-100:#1E3529;
  --slate-100:#26303A;
  --slate-600:#8A929B;
  --on-accent:#0D1418;
  --accent-a:#4FB3A9;
  --accent-b:#A78BFA;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper-0);
  color:var(--ink-900);
  font-family:Arial,"Helvetica Neue",Helvetica,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
h1,h2,h3{font-family:"Baloo 2",Arial,sans-serif; font-weight:700; text-wrap:balance; margin:0; color:var(--ink-900);}
a{color:var(--teal-600);}
.mono{font-family:"IBM Plex Mono",Consolas,monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit; font-size:inherit;}
input,select,textarea{font-family:inherit; font-size:inherit;}
:focus-visible{outline:2px solid var(--teal-600); outline-offset:2px;}

.shell{display:flex; min-height:100vh;}
.rail{
  width:216px; flex:0 0 216px;
  background:var(--paper-50);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:20px 14px;
  gap:22px;
}
.wordmark{
  font-family:"Baloo 2",sans-serif; font-weight:800; font-size:23px; letter-spacing:0.01em; padding:0 8px;
  background-image:linear-gradient(135deg, var(--accent-a), var(--accent-b));
  background-clip:text; -webkit-background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  display:inline-block;
}
.wordmark small{display:block; font-family:Arial,sans-serif; font-weight:600; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-400); margin-top:2px; -webkit-text-fill-color:var(--ink-400);}

/* ---------- Interactive logo (hover/focus reveals a smiley in the two O's of "Doctor") ---------- */
.logo1{
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; outline:none; padding:20px 10px; -webkit-tap-highlight-color:transparent;
}
.logo1 .row{
  display:inline-flex; align-items:flex-end; white-space:nowrap;
  font-family:'Fredoka', system-ui, sans-serif; font-size:clamp(1.9rem, 4vw, 2.6rem); font-weight:600; color:var(--ink-900);
}
.logo1 .word-doctor{ display:inline-flex; align-items:flex-end; transform-origin:50% 60%; transition:transform .65s cubic-bezier(.4,0,.2,1); }
.logo1 .eyes-wrap{ position:relative; display:inline-flex; align-items:flex-end; }
.logo1 .arc{ position:absolute; left:0; right:0; bottom:-0.39em; width:100%; height:0.45em; pointer-events:none; z-index:0; }
.logo1 .arc path{ fill:none; stroke:var(--ink-900); stroke-width:6; stroke-linecap:round; vector-effect:non-scaling-stroke; transition:stroke .5s ease, stroke-width .5s ease; }
.logo1 .ltr, .logo1 .wd, .logo1 .sp{
  position:relative; z-index:1; display:inline-block; overflow:hidden;
  transition:max-width .55s cubic-bezier(.4,0,.2,1), opacity .35s ease, transform .45s ease, margin .55s ease;
}
.logo1 .collapse{ max-width:2.4em; }
.logo1 .sp.collapse{ max-width:0.6em; }
.logo1 .wd.collapse{ max-width:9em; }
.logo1 .eye{ transition:color .45s ease, transform .45s cubic-bezier(.4,0,.2,1); }
.logo1:hover .word-doctor, .logo1:focus-visible .word-doctor{ transform:scale(2.15); }
.logo1:hover .collapse, .logo1:focus-visible .collapse,
.logo1:hover .sp.collapse, .logo1:focus-visible .sp.collapse,
.logo1:hover .wd.collapse, .logo1:focus-visible .wd.collapse{
  max-width:0; opacity:0; margin-left:0; margin-right:0; transform:scale(.5);
}
.logo1:hover .eye, .logo1:focus-visible .eye{ color:#FF6B4A; transform:translateY(-4%); }
.logo1:hover .arc path, .logo1:focus-visible .arc path{ stroke:#FF6B4A; stroke-width:7.5; }
@media (prefers-reduced-motion: reduce){
  .logo1 .word-doctor, .logo1 .ltr, .logo1 .wd, .logo1 .sp, .logo1 .arc path{ transition:none; }
}
.topbar .logo1{ padding:0; width:250px; flex:0 0 auto; justify-content:center; justify-self:center; }
.topbar .logo1 .row{ font-size:1.35rem; }
.login-card .logo1{ padding:4px 0 18px; width:100%; }
.login-card .logo1 .row{ font-size:1.9rem; }
.nav{display:flex; flex-direction:column; gap:2px;}
.nav a{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:8px;
  color:var(--ink-600); text-decoration:none; font-weight:500;
  font-size:13.5px;
}
.nav a:hover{background:var(--paper-100); color:var(--ink-900);}
.nav a.active{background:var(--teal-100); color:var(--teal-700); font-weight:600;}
.nav .dot{width:6px;height:6px;border-radius:50%; background:currentColor; opacity:0.55; flex:0 0 auto;}
.rail-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px;}
.viewer-field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-400); margin-bottom:4px;}
.viewer-field input{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--paper-0); color:var(--ink-900);}
.access-note{font-size:11.5px; color:var(--ink-400); line-height:1.4;}
.access-note.warn{color:var(--amber-600);}
.login-screen{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; background:var(--paper-50);}
.login-card{background:var(--paper-0); border:1px solid var(--line); border-radius:14px; padding:32px; width:340px; box-shadow:var(--shadow);}
.login-card .wordmark{display:block; margin-bottom:18px; font-size:22px;}
.login-card .form-row{margin-bottom:14px;}
.login-card .form-row label{display:block; font-size:12px; font-weight:600; color:var(--ink-600); margin-bottom:5px;}
.login-card .form-row input{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper-0); color:var(--ink-900);}
.login-error{background:var(--rust-100); color:var(--rust-600); border-radius:8px; padding:8px 10px; font-size:13px; margin-bottom:14px;}
.loading-msg{color:var(--ink-600); font-size:13.5px;}
.not-synced-note{background:var(--amber-100); color:var(--amber-600); border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; line-height:1.4;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; column-gap:12px;
  padding:14px 28px 26px; border-bottom:1px solid var(--line);
  background:var(--paper-0);
  position:sticky; top:0; z-index:5;
}
.topbar-left{ justify-self:start; }
.topbar-right{ justify-self:end; }
.topbar .search{flex:1; max-width:360px; position:relative;}
.topbar .search input{
  width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper-50); color:var(--ink-900);
}
.spacer{flex:1;}
.content{padding:26px 28px 60px; max-width:1180px; width:100%; margin:0 auto;}

.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
  padding:8px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper-0); color:var(--ink-900); font-weight:700; font-size:13px;
  cursor:pointer; text-decoration:none; white-space:nowrap;
  transition:transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
}
.btn:hover{background:var(--paper-100); transform:translateY(-1px); box-shadow:var(--shadow);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--teal-600); border-color:var(--teal-600); color:var(--on-accent);}
.btn-primary:hover{background:var(--teal-700); border-color:var(--teal-700);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--paper-100);}
.btn-danger{color:var(--rust-600);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:0.5; cursor:not-allowed;}
.btn-back{padding:8px 12px;}
.btn-icon{
  display:inline-flex; align-items:center; justify-content:center;
  width:28px; height:28px; padding:0; border-radius:7px; border:1px solid transparent;
  background:transparent; color:var(--ink-600); font-size:14px; line-height:1; cursor:pointer;
}
.btn-icon:hover{background:var(--paper-100); color:var(--ink-900); border-color:var(--line);}
.btn-icon-danger:hover{background:var(--rust-100); color:var(--rust-600); border-color:var(--rust-600);}

.qv-overlay{
  position:fixed; inset:0; background:rgba(20,20,19,0.32); z-index:40;
  animation:qvFadeIn .16s ease-out;
}
.qv-panel{
  position:fixed; top:0; right:0; bottom:0; width:380px; max-width:92vw;
  background:var(--paper-0); border-left:1px solid var(--line); box-shadow:var(--shadow);
  z-index:41; display:flex; flex-direction:column; overflow-y:auto;
  animation:qvSlideIn .18s ease-out;
}
.qv-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  padding:20px 20px 16px; border-bottom:1px solid var(--line);
}
.qv-head h2{font-size:19px;}
.qv-body{padding:18px 20px; display:flex; flex-direction:column; gap:16px;}
.qv-skills label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-400); margin-bottom:6px;}
.qv-notes{border-top:1px solid var(--line); padding-top:14px;}
.qv-notes label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-400); margin-bottom:8px;}
.qv-note-form textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper-0);
  color:var(--ink-900); font-family:inherit; font-size:12.5px; resize:vertical; min-height:44px;
}
.qv-note-list{margin-top:12px; display:flex; flex-direction:column; gap:10px;}
.qv-note-item{padding:8px 10px; background:var(--paper-50); border:1px solid var(--line); border-radius:8px;}
.qv-note-text{font-size:12.5px; line-height:1.5;}
.qv-note-meta{font-size:11px; color:var(--ink-400); margin-top:4px;}
.qv-note-more{font-size:11.5px; color:var(--ink-400); margin-top:8px;}
.qv-foot{
  margin-top:auto; display:flex; gap:8px; padding:16px 20px; border-top:1px solid var(--line);
}
@keyframes qvFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes qvSlideIn{from{transform:translateX(28px); opacity:0;}to{transform:translateX(0); opacity:1;}}
@media (prefers-reduced-motion: reduce){
  .qv-overlay, .qv-panel{animation:none;}
}

.menu-wrap{position:relative; display:inline-block;}
.menu{
  position:absolute; right:0; top:calc(100% + 6px); z-index:20;
  background:var(--paper-0); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); min-width:180px; padding:6px; display:none;
}
.menu.open{display:block;}
.menu button{
  display:block; width:100%; text-align:left; padding:8px 10px; border-radius:7px;
  border:none; background:transparent; color:var(--ink-900); cursor:pointer; font-size:13px;
}
.menu button:hover{background:var(--paper-100);}

.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.home-date-nav{display:flex; align-items:center; gap:6px;}
.home-date-nav input[type=date]{padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:var(--paper-0); color:var(--ink-900); font-size:13px;}
.today-tag{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--teal-700); background:var(--teal-100); border-radius:5px; padding:2px 7px; vertical-align:middle; margin-left:6px;}
.page-head h1{font-size:26px;}
.page-head .sub{color:var(--ink-600); font-size:13px; margin-top:4px;}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px;}
.stat-tile{
  background:var(--paper-50); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; display:flex; flex-direction:column; gap:6px;
}
.stat-tile .num{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:500; font-variant-numeric:tabular-nums;}
.stat-tile .lbl{font-size:12px; color:var(--ink-600); text-transform:uppercase; letter-spacing:0.05em;}
.stat-tile.warn .num{color:var(--amber-600);}
.stat-tile.crit .num{color:var(--rust-600);}
.stat-tile.good .num{color:var(--green-600);}
.stat-tile.accent .num{color:var(--teal-600);}

.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;}

.panel{background:var(--paper-50); border:1px solid var(--line); border-radius:14px; padding:16px 18px;}
.panel h2{font-size:15px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; font-family:Arial,sans-serif; font-weight:700;}
.panel h2 .cnt{font-family:"IBM Plex Mono",monospace; color:var(--ink-400); font-size:12px; font-weight:500;}

.task-row{
  display:flex; align-items:flex-start; gap:10px; padding:9px 4px;
  border-bottom:1px solid var(--line);
}
.task-row:last-child{border-bottom:none;}
.task-check{
  width:17px;height:17px; border-radius:5px; border:1.5px solid var(--ink-400);
  background:var(--paper-0); flex:0 0 auto; margin-top:2px; cursor:pointer; appearance:none;
}
.task-check:checked{background:var(--teal-600); border-color:var(--teal-600);}
.task-body{flex:1; min-width:0;}
.task-title{font-weight:500; font-size:13.5px;}
.task-meta{font-size:12px; color:var(--ink-400); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap;}
.task-meta a{color:var(--ink-600); text-decoration:none; border-bottom:1px dotted var(--line);}
.due-chip{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:2px 6px; border-radius:5px; background:var(--paper-100); color:var(--ink-600);}
.due-chip.today{background:var(--amber-100); color:var(--amber-600);}
.due-chip.over{background:var(--rust-100); color:var(--rust-600);}
.task-row.done .task-title{text-decoration:line-through; color:var(--ink-400);}
.task-row.done{opacity:0.7;}
.task-completed-divider{
  display:flex; align-items:center; gap:8px; margin:14px 0 4px; padding-top:10px; border-top:1px solid var(--line);
  font-size:11px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; color:var(--ink-400);
}
.task-completed-divider .cnt{font-family:"IBM Plex Mono",monospace; text-transform:none; letter-spacing:0; font-weight:500;}

.empty{
  padding:34px 20px; text-align:center; color:var(--ink-600);
  border:1px dashed var(--line); border-radius:12px; background:var(--paper-50);
}
.empty h3{font-size:16px; margin-bottom:6px; color:var(--ink-900);}
.empty p{margin:0 0 14px; font-size:13px;}

.filter-bar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
.filter-bar input[type="text"]{padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper-0); min-width:220px;}
.filter-bar select{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper-0); color:var(--ink-900);}
.pill-filter{display:flex; gap:6px; flex-wrap:wrap;}
.pill-filter button{
  padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--paper-0);
  font-size:12.5px; color:var(--ink-600); cursor:pointer;
}
.pill-filter button.active{background:var(--ink-900); border-color:var(--ink-900); color:var(--paper-0);}

table{width:100%; border-collapse:collapse;}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--paper-0);}
th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
  color:var(--ink-400); padding:10px 14px; border-bottom:1px solid var(--line);
  background:var(--paper-50); white-space:nowrap;
}
td{padding:11px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--paper-50);}
td.name{font-weight:600;}
td .muted{color:var(--ink-400); font-size:12.5px;}

.stage-pill{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
  font-size:11.5px; font-weight:600; white-space:nowrap;
}

.detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.detail-title h1{font-size:24px;}
.detail-title .org-sub{color:var(--ink-600); font-size:13px; margin-top:4px;}
.contact-line{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:13px;}
.contact-line a{color:var(--ink-600); text-decoration:none;}
.contact-line a:hover{color:var(--teal-600);}
.action-row{display:flex; gap:8px; flex-wrap:wrap;}

.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
.field-grid .full{grid-column:1 / -1;}
.field-item label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-400); margin-bottom:4px;}
.field-item .val{font-size:13.5px;}
select.stage-select{padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper-0); font-weight:600;}

.timeline{display:flex; flex-direction:column; gap:0;}
.tl-item{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:8px;height:8px; border-radius:50%; background:var(--teal-600); margin-top:6px; flex:0 0 auto;}
.tl-dot.task-dot{background:var(--amber-600);}
.tl-dot.done-dot{background:var(--green-600);}
.tl-body{flex:1; min-width:0;}
.tl-text{font-size:13.5px;}
.tl-time{font-size:11.5px; color:var(--ink-400); margin-top:2px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,26,32,0.42);
  display:flex; align-items:flex-start; justify-content:center;
  padding:48px 16px; overflow-y:auto; z-index:50;
}
.modal{
  background:var(--paper-0); border-radius:18px; padding:22px 24px; width:100%; max-width:480px;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
.modal h2{font-size:17px; margin-bottom:16px; font-family:"Baloo 2",Arial,sans-serif; font-weight:700;}
.form-row{margin-bottom:12px;}
.form-row label{display:block; font-size:12px; font-weight:600; color:var(--ink-600); margin-bottom:5px;}
.form-row input, .form-row select, .form-row textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper-0); color:var(--ink-900);
}
.form-row textarea{min-height:72px; resize:vertical;}
.signature-editor{
  min-height:90px; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper-0); color:var(--ink-900); font-size:13px; line-height:1.5;
}
.signature-editor:focus{outline:2px solid var(--teal-600); outline-offset:1px;}
.signature-editor:empty:before{content:attr(data-placeholder); color:var(--ink-400); white-space:pre-wrap;}
.signature-editor img{max-width:280px; display:block; margin-top:6px;}
.signature-editor-actions{display:flex; align-items:center; gap:10px; margin-top:8px;}
.signature-upload-status{font-size:12px; color:var(--ink-600);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px;}
.form-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--ink-900); color:var(--paper-0); padding:10px 16px; border-radius:8px;
  font-size:13px; box-shadow:var(--shadow); max-width:320px;
}

.inline-form{display:flex; gap:8px; margin-top:10px;}
.inline-form input, .inline-form select{
  padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--paper-0); color:var(--ink-900);
}
.inline-form input[type="text"]{flex:1;}

/* sidebar search */
.side-search{position:relative;}
.side-search input{
  width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper-0); color:var(--ink-900); font-size:13px;
}
.side-results{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:30;
  background:var(--paper-0); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); max-height:260px; overflow-y:auto; display:none;
}
.side-results.open{display:block;}
.side-results a{
  display:block; padding:8px 10px; text-decoration:none; color:var(--ink-900); font-size:13px;
  border-bottom:1px solid var(--line);
}
.side-results a:last-child{border-bottom:none;}
.side-results a:hover{background:var(--paper-100);}
.side-results a .kind{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-400); display:block; margin-top:1px;}
.side-results .none{padding:10px; font-size:12.5px; color:var(--ink-400);}

/* searchable combobox picker (used in place of giant <select> lists) */
.combo{position:relative;}
.combo-input{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper-0); color:var(--ink-900);
}
.combo-menu{
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20;
  background:var(--paper-0); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); max-height:220px; overflow-y:auto;
}
.combo-menu[hidden]{display:none;}
.combo-item{padding:8px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line);}
.combo-item:last-child{border-bottom:none;}
.combo-item:hover{background:var(--paper-100);}
.combo-empty{padding:10px; font-size:12.5px; color:var(--ink-400);}

.pagination{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px;}
.pagination-info{font-size:12.5px; color:var(--ink-600);}

/* tabs */
.tabbar{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px;}
.tabbar a{
  padding:9px 4px; margin-right:18px; text-decoration:none; color:var(--ink-600); font-weight:600;
  font-size:13.5px; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tabbar a:hover{color:var(--ink-900);}
.tabbar a.active{color:var(--teal-700); border-bottom-color:var(--teal-600);}

/* bulk action bar */
.bulk-bar{
  display:flex; align-items:center; gap:10px; padding:9px 14px; margin-bottom:12px;
  background:var(--teal-100); border:1px solid var(--teal-600); border-radius:10px; font-size:13px;
}
.bulk-bar .count{font-weight:600; color:var(--teal-700);}
.bulk-bar .spacer{flex:1;}

/* filter row inside tables */
.filter-row th{background:var(--paper-0); padding:6px 10px; border-bottom:1px solid var(--line);}
.filter-row input, .filter-row select{
  width:100%; padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:var(--paper-50);
  color:var(--ink-900); font-size:12px;
}
th.sortable{cursor:pointer; user-select:none;}
th.sortable .car{display:inline-block; margin-left:4px; width:0; height:0; vertical-align:middle;
  border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:5px solid var(--ink-400);}
th.sortable.desc .car{border-bottom:none; border-top:5px solid var(--ink-400);}
td.checkcell, th.checkcell{width:34px; text-align:center;}

/* tags */
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.tag{
  display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
  background:var(--paper-100); color:var(--ink-600); font-size:12px; border:1px solid var(--line);
}
.checkbox-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:2px;}
.checkbox-chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px;
  border:1px solid var(--line); background:var(--paper-50); font-size:12.5px; font-weight:500; cursor:pointer;
}
.checkbox-chip input{width:auto; margin:0;}
.checkbox-chip:has(input:checked){border-color:var(--teal-600); background:var(--teal-100); color:var(--teal-700);}

/* placement detail */
.placement-view{display:flex; gap:18px; align-items:flex-start; margin:-26px -28px 0; }
.placement-ribbon{
  flex:0 0 34px; align-self:stretch; background:var(--teal-700); border-radius:0 8px 8px 0;
  display:flex; align-items:center; justify-content:center; min-height:220px;
}
.placement-ribbon span{
  writing-mode:vertical-rl; transform:rotate(180deg); color:var(--on-accent);
  font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
}
.placement-main{flex:1; min-width:0; padding:26px 28px 60px 0;}
.placement-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.avatar-circle{
  flex:0 0 auto; width:56px; height:56px; border-radius:50%;
  background-image:linear-gradient(135deg, var(--accent-a), var(--accent-b)); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:"Baloo 2",sans-serif; font-weight:700; font-size:20px;
  box-shadow:var(--shadow);
}
.placement-head-body{flex:1; min-width:0;}
.placement-head-body h1{font-size:22px;}
.placement-chips{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
.placement-idline{color:var(--ink-600); font-size:12.5px; margin-top:8px;}
.placement-idline a{color:var(--ink-600);}
.placement-idline a:hover{color:var(--teal-600);}
.placement-head-actions{display:flex; gap:8px; flex:0 0 auto;}
.placement-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start;}
.placement-col{display:flex; flex-direction:column;}
.muted-dash{color:var(--ink-400);}
.link-add{background:none; border:none; color:var(--teal-600); font-weight:600; font-size:13px; cursor:pointer; padding:0;}
.link-add:hover{text-decoration:underline;}
.file-chip{

function secureToken(){
  var cryptoObj = window.crypto || window.msCrypto;
  var bytes = new Uint8Array(24);
  if (cryptoObj && cryptoObj.getRandomValues){ cryptoObj.getRandomValues(bytes); }
  else { for (var i=0;i<bytes.length;i++){ bytes[i] = Math.floor(Math.random()*256); } }
  var hex = "";
  for (var j=0;j<bytes.length;j++){ hex += (bytes[j] < 16 ? "0" : "") + bytes[j].toString(16); }
  return hex;
}

function pad2(n){ return n < 10 ? "0" + n : "" + n; }

function addDaysISO(iso, days){
  var parts = iso.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}

  return d + " " + MONTHS[m-1] + " " + y;
}

function fmtDateTime(ts){
  var d = new Date(ts);
  return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear() + ", " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());

var HONORIFICS = ["dr","prof","a/prof","assoc","mr","mrs","ms","miss","mx"];
function firstNameOf(name){
  var parts = (name||"").trim().split(/\s+/).filter(Boolean);
  var i = 0;
  while (i < parts.length - 1 && HONORIFICS.indexOf(parts[i].toLowerCase().replace(/\.+$/,"")) > -1){ i++; }
  return parts[i] || "";
}

/* ---------- live email sending (Resend, via the send-email edge function) ---------- */

function sendViaResend(payload){
  return sb.functions.invoke("send-email", { body: payload }).then(function(res){
    if (res.error){
      var ctx = res.error && res.error.context;
      var bodyPromise = (ctx && typeof ctx.json === "function") ? ctx.json().catch(function(){ return null; }) : Promise.resolve(null);
      return bodyPromise.then(function(errBody){
        var msg = (errBody && errBody.error) || res.error.message || "Could not send email.";
        return { ok:false, error: msg, notConfigured: /not configured/i.test(msg) };
      });
    }
    if (res.data && res.data.error){
      return { ok:false, error: res.data.error, notConfigured: /not configured/i.test(res.data.error) };
    }
    return { ok:true, id: res.data && res.data.id };
  }).catch(function(){
    return { ok:false, error:"Network error - could not reach the email service.", notConfigured:false };
  });
}

// Sends an invoice (or reminder) via the send-invoice-email edge function, which builds the
// actual invoice content itself (line items, live bank details, and the linked timesheet as a
// PDF attachment) - this only has to hand over the recipient and the human message.
function sendInvoiceEmail(payload){
  return sb.functions.invoke("send-invoice-email", { body: payload }).then(function(res){
    if (res.error){
      var ctx = res.error && res.error.context;
      var bodyPromise = (ctx && typeof ctx.json === "function") ? ctx.json().catch(function(){ return null; }) : Promise.resolve(null);
      return bodyPromise.then(function(errBody){
        var msg = (errBody && errBody.error) || res.error.message || "Could not send email.";
        return { ok:false, error: msg, notConfigured: /not configured/i.test(msg) };
      });
    }
    if (res.data && res.data.error){

    }
    return { ok:true, id: res.data && res.data.id, attachmentCount: res.data && res.data.attachmentCount };
  }).catch(function(){

  });
}

function runBulkSendPool(recipients, cfg, subjectRaw, bodyRaw, concurrency){
  var total = recipients.length, idx = 0, sent = 0, failed = 0, completed = 0;
  return new Promise(function(resolve){
    function next(){
      if (idx >= total) return;
      var r = recipients[idx++];
      var tk = cfg.tokens(r);
      var subj = replaceTokens(subjectRaw, tk), bod = replaceTokens(bodyRaw, tk);
      sendViaResend({ to:r.email, subject:subj, text:bod, linkedType:cfg.linkedType, linkedId:r.id }).then(function(result){
        if (result.ok){ sent++; addNoteFull(cfg.linkedType, r.id, { noteType:"Email", text:"Emailed via bulk send: "+subj, date: todayISO() }); }
        else { failed++; }
        completed++;
        if (completed >= total){ resolve({ sent:sent, failed:failed }); } else { next(); }
      });
    }
    for (var i=0;i<concurrency && i<total;i++){ next(); }
  });
}

function runBulkSend(recipients, cfg, subjectRaw, bodyRaw){
  if (!recipients.length) return Promise.resolve({ sent:0, failed:0, notConfigured:false });
  var first = recipients[0];
  var tk0 = cfg.tokens(first);
  var subj0 = replaceTokens(subjectRaw, tk0), bod0 = replaceTokens(bodyRaw, tk0);
  return sendViaResend({ to:first.email, subject:subj0, text:bod0, linkedType:cfg.linkedType, linkedId:first.id }).then(function(firstResult){
    if (firstResult.notConfigured){ return { sent:0, failed:0, notConfigured:true }; }
    var sent = firstResult.ok ? 1 : 0, failed = firstResult.ok ? 0 : 1;
    if (firstResult.ok){ addNoteFull(cfg.linkedType, first.id, { noteType:"Email", text:"Emailed via bulk send: "+subj0, date: todayISO() }); }
    var rest = recipients.slice(1);
    if (!rest.length) return { sent:sent, failed:failed, notConfigured:false };
    return runBulkSendPool(rest, cfg, subjectRaw, bodyRaw, 4).then(function(r){
      return { sent: sent+r.sent, failed: failed+r.failed, notConfigured:false };
    });
  });
}

/* ---------- Auth + initial data load ---------- */

function initAuth(){
  sb.auth.onAuthStateChange(function(event, session){
    currentUser = session ? session.user : null;
    authChecked = true;
    if (currentUser && !dataLoaded && !dataLoading){
      loadInitialData();
    } else if (!currentUser){
      dataLoaded = false;
      state.doctors = []; state.hospitals = []; state.clients = []; state.notes = []; state.tasks = [];
      state.jobs = []; state.placements = []; state.timesheets = []; state.invoices = []; state.emailTemplates = [];
      state.sentEmails = []; state.mySettings = { displayName:"", sendFromEmail:"", signatureHtml:"" }; state.jobInterests = []; state.documents = [];
      invalidateRecruitersCache();
      render();
    } else {
      render();
    }
  });
  sb.auth.getSession().then(function(res){
    currentUser = res.data && res.data.session ? res.data.session.user : null;
    authChecked = true;
    if (currentUser){ loadInitialData(); } else { render(); }
  });
}

function sbFetchAll(table){
  var pageSize = 1000;
  var all = [];
  function fetchPage(from){
    return sb.from(table).select("*").range(from, from + pageSize - 1).then(function(res){
      if (res.error) throw res.error;
      var rows = res.data || [];
      all = all.concat(rows);
      if (rows.length === pageSize){
        return fetchPage(from + pageSize);
      }
      return all;
    });
  }
  return fetchPage(0);
}

function loadInitialData(){
  dataLoading = true;
  render();
  Promise.all([
    sbFetchAll("doctors"),
    sbFetchAll("hospitals"),
    sbFetchAll("clients"),
    sbFetchAll("notes"),
    sbFetchAll("tasks"),
    sbFetchAll("jobs"),
    sbFetchAll("placements"),
    sbFetchAll("timesheets"),
    sbFetchAll("invoices"),
    sbFetchAll("email_templates"),
    sbFetchAll("agency_settings"),
    sbFetchAll("sent_emails"),
    sbFetchAll("user_settings"),
    sbFetchAll("documents"),
    sbFetchAll("job_interests")
  ]).then(function(results){
    state.doctors = (results[0]||[]).map(rowToDoctor);
    state.hospitals = (results[1]||[]).map(rowToHospital);
    state.clients = (results[2]||[]).map(rowToClient);
    state.notes = (results[3]||[]).map(rowToNote);
    state.tasks = (results[4]||[]).map(rowToTask);
    state.jobs = (results[5]||[]).map(rowToJob);
    state.placements = (results[6]||[]).map(rowToPlacement);
    state.timesheets = (results[7]||[]).map(rowToTimesheet);
    state.invoices = (results[8]||[]).map(rowToInvoice);
    state.emailTemplates = (results[9]||[]).map(rowToTemplate);
    if (results[10] && results[10][0]){ state.settings.agency = rowToAgencySettings(results[10][0]); }
    state.sentEmails = (results[11]||[]).map(rowToSentEmail);
    // user_settings now returns every CRM login's row (RLS opened up for read, see the
    // recruiter-picker migration), not just the signed-in user's - so pick "my settings" out
    // by id, and keep the full list separately to populate the placement Recruiter picker.
    var userSettingsRows = results[12] || [];
    state.crmUsers = userSettingsRows.map(rowToCrmUser);
    var myRow = currentUser ? userSettingsRows.filter(function(r){ return r.id === currentUser.id; })[0] : null;
    if (myRow){
      state.mySettings = { displayName: myRow.display_name||"", sendFromEmail: myRow.send_from_email||"", signatureHtml: myRow.email_signature_html||"" };
    }
    state.documents = (results[13]||[]).map(rowToDocument);
    state.jobInterests = (results[14]||[]).map(rowToJobInterest);
    maybeCreateStorageCheckTask();
    sweepDocumentExpiries();
    dataLoaded = true;
    dataLoading = false;
    invalidateRecruitersCache();
    render();
  }).catch(function(err){
    dataLoading = false;
    console.error(err);
    toast("Could not load data - check your connection and reload the page.");
    render();
  });
}

// Removes a linked record's documents from local state AND their actual bytes from Supabase
// Storage (not just the metadata row) - otherwise deleted records would leave orphaned files
// quietly eating into the storage quota forever.
function purgeDocumentsFor(linkedType, linkedId){
  var removed = state.documents.filter(function(doc){ return doc.linkedType===linkedType && doc.linkedId===linkedId; });
  state.documents = state.documents.filter(function(doc){ return !(doc.linkedType===linkedType && doc.linkedId===linkedId); });
  var paths = removed.map(function(doc){ return doc.storagePath; }).filter(Boolean);
  if (paths.length){
    sb.storage.from("documents").remove(paths).then(function(res){ if (res.error) console.error("delete storage objects failed", res.error); });
  }
}
function removeLinkedRecords(linkedType, linkedId){
  state.notes = state.notes.filter(function(n){ return !(n.linkedType===linkedType && n.linkedId===linkedId); });
  state.tasks = state.tasks.filter(function(t){ return !(t.linkedType===linkedType && t.linkedId===linkedId); });
  purgeDocumentsFor(linkedType, linkedId);
}
function deleteDoctor(id){
  state.doctors = state.doctors.filter(function(d){ return d.id !== id; });
  state.placements = state.placements.filter(function(p){ return p.doctorId !== id; });
  state.timesheets = state.timesheets.filter(function(t){ return t.doctorId !== id; });
  state.invoices = state.invoices.filter(function(inv){ return inv.doctorId !== id; });
  removeLinkedRecords("doctor", id);
  sbDelete("doctors", id);
  sbDeleteLinked("notes", "doctor", id);
  sbDeleteLinked("tasks", "doctor", id);
  sbDeleteLinked("documents", "doctor", id);
  sbDeleteWhere("placements", "doctor_id", id);
  sbDeleteWhere("timesheets", "doctor_id", id);
  sbDeleteWhere("invoices", "doctor_id", id);
}
function deleteHospital(id){
  var removedClientIds = state.clients.filter(function(c){ return c.hospitalId === id; }).map(function(c){ return c.id; });
  state.hospitals = state.hospitals.filter(function(h){ return h.id !== id; });

  state.jobs = state.jobs.filter(function(j){ return j.hospitalId !== id; });

  state.timesheets = state.timesheets.filter(function(t){ return t.hospitalId !== id; });
  state.invoices = state.invoices.filter(function(inv){ return inv.hospitalId !== id; });
  removeLinkedRecords("hospital", id);
  sbDelete("hospitals", id);
  sbDeleteLinked("notes", "hospital", id);

  sbDeleteLinked("documents", "hospital", id);
  sbDeleteWhere("jobs", "hospital_id", id);
  sbDeleteWhere("placements", "hospital_id", id);
  sbDeleteWhere("timesheets", "hospital_id", id);
  sbDeleteWhere("invoices", "hospital_id", id);
  if (removedClientIds.length) sbDeleteMany("clients", removedClientIds);
  removedClientIds.forEach(function(cid){
    purgeDocumentsFor("client", cid);
    sbDeleteLinked("notes","client",cid); sbDeleteLinked("tasks","client",cid); sbDeleteLinked("documents","client",cid);
  });
}

  state.placements = state.placements.filter(function(p){ return !idSet[p.doctorId]; });

function placementNetMargin(p){
  var c = parseFloat(p.clientRate), r = parseFloat(p.candidateRate);
  if (isNaN(c) || isNaN(r)) return null;
  return c - r;
}
function placementWeeklyMargin(p){
  var net = placementNetMargin(p);
  var days = parseFloat(p.daysPerWeek);
  if (net === null || isNaN(days)) return null;
  return net * days;
}
// Timesheets never get generated for Permanent placements (see the scheduler), so an approver
// email is only meaningful - and only required - for every other placement type.
function placementHasRequiredApprover(fd){

  if (placementType === "Permanent") return true;
  return !!(fd.get("timesheetApproverEmail")||"").trim();
}
// Invoicing contact (name + email) is required on every placement, Permanent included - even a
// one-off placement fee needs somewhere to send the invoice.
function placementHasRequiredInvoicingContact(fd){
  return !!(fd.get("billingContact")||"").trim() && !!(fd.get("billingEmail")||"").trim();
}
// Returns a user-facing error string for the first missing required field, or null if the
// placement form is good to save.
function placementValidationError(fd){
  if (!placementHasRequiredApprover(fd)){
    return "Please add a timesheet approver email - without it, timesheets for this placement can never be sent for approval.";
  }
  if (!placementHasRequiredInvoicingContact(fd)){
    return "Please add an invoicing contact name and email - without it, there's nowhere to send the invoice.";

function fmtMoney(n){
  if (n === null || n === undefined || n === "" || isNaN(n)) return null;
  var num = Number(n);
  var neg = num < 0; num = Math.abs(num);
  var s = num.toFixed(num % 1 === 0 ? 0 : 2);
  var parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg?"-":"") + "$" + parts.join(".");
}

function dateRangeArray(startIso, endIso){
  var out = [];
  if (!startIso || !endIso) return out;
  var d = new Date(startIso+"T00:00:00");
  var end = new Date(endIso+"T00:00:00");
  var guard = 0;
  while (d <= end && guard < 62){
    out.push(d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()));
    d.setDate(d.getDate()+1);
    guard++;
  }
  return out;
}
function addTimesheet(data){

    id: uid("ts"), placementId: data.placementId, doctorId: data.doctorId, hospitalId: data.hospitalId,
    periodStart: data.periodStart, periodEnd: data.periodEnd,
    entries: dates.map(function(dt){ return { date: dt, hours: "", notes: "" }; }),
    status: "Draft", createdAt: Date.now(), updatedAt: Date.now(), submittedBy: "",
    doctorToken: secureToken(), approverToken: secureToken(),
    doctorLinkSentAt: null, approverLinkSentAt: null,
    approvedByName: "", approvedAt: null, approvedIp: "", approverNotes: ""
  };
  state.timesheets.push(t);
  sbInsert("timesheets", timesheetToRow(t));

function invoiceSubtotal(inv){

  (inv.lineItems||[]).forEach(function(li){

  });

}

function suggestInvoiceLineItem(placement, type){
  if (!placement) return { description: "Locum placement", qty: 1, unitPrice: 0 };
  var ts = timesheetsForPlacement(placement.id);
  var totalHours = 0, totalDays = 0;
  ts.forEach(function(t){ totalHours += timesheetTotalHours(t); totalDays += timesheetWorkedDays(t); });
  var rate = type === "agency" ? placementNetMargin(placement) : parseFloat(placement.candidateRate);
  if (rate === null || isNaN(rate)) rate = 0;
  var qty = 1, unitLabel = "";
  if (placement.rateType === "Hourly Rate" && totalHours > 0){ qty = totalHours; unitLabel = " (" + totalHours + " hrs)"; }
  else if (totalDays > 0){ qty = totalDays; unitLabel = " (" + totalDays + " day" + (totalDays===1?"":"s") + ")"; }
  var doc = findDoctor(placement.doctorId);
  var hosp = findHospital(placement.hospitalId);
  var desc = (type === "agency" ? "Placement fee - " : "Locum services - ") +
    (doc?doc.name:"") + " at " + (hosp?hosp.name:"") +
    (placement.jobTitle ? " (" + placement.jobTitle + ")" : "") + unitLabel;
  return { description: desc, qty: qty, unitPrice: rate };
}

  lines.push("");

  if (to.address){ lines.push(to.address); }
  lines.push("");
  lines.push("Issue date: " + fmtDate(inv.issueDate));

  if (to.poNumber){ lines.push("PO number: " + to.poNumber); }
  lines.push("");
  lines.push("Line items:");

    var amt = (parseFloat(li.qty)||0) * (parseFloat(li.unitPrice)||0);

}

function safeStorageName(name){
  return String(name||"file").replace(/[^a-zA-Z0-9._-]+/g, "_").slice(-120);
}
// Uploads an image (pasted or picked) to the public signature-assets bucket and inserts it at
// the end of the signature editor. Always appends at the end rather than at the caret - the
// upload is async, and by the time it resolves the browser's text selection may have moved or
// been lost, so trying to restore an exact cursor position isn't reliable.
function insertSignatureImage(file){
  if (!file || !file.type || file.type.indexOf("image/") !== 0){
    toast("That doesn't look like an image file.");
    return;
  }
  if (file.size > SIGNATURE_IMAGE_MAX_BYTES){
    toast("That image is over the "+fmtFileSize(SIGNATURE_IMAGE_MAX_BYTES)+" limit for a signature image.");
    return;
  }
  var statusEl = document.getElementById("signature-upload-status");
  if (statusEl) statusEl.textContent = "Uploading image...";
  var path = (currentUser ? currentUser.id : "shared") + "/" + uid("sig") + "_" + safeStorageName(file.name);
  sb.storage.from("signature-assets").upload(path, file, { contentType: file.type }).then(function(res){
    if (res.error){
      if (statusEl) statusEl.textContent = "";
      toast("Could not upload that image - check your connection and try again.");
      return;
    }
    var pub = sb.storage.from("signature-assets").getPublicUrl(path);
    var url = pub && pub.data && pub.data.publicUrl;
    var editor = document.getElementById("signature-editor");
    if (editor && url){
      editor.insertAdjacentHTML("beforeend", '<img src="'+escapeHtml(url)+'" alt="" />');
      editor.focus();
    }
    if (statusEl) statusEl.textContent = "";
  }).catch(function(){
    if (statusEl) statusEl.textContent = "";
    toast("Could not upload that image - check your connection and try again.");
  });
}
// Uploads the actual file bytes to Supabase Storage (private "documents" bucket), then saves
// the metadata row - the file itself never touches the CRM's own database or in-memory state
// as base64 the way it briefly did before. Returns a promise resolving to the new doc record,
// or null if the upload failed (caller is expected to have already shown a toast via sbRowError).
function addDocumentRecord(linkedType, linkedId, file, category, expiryDate){
  var id = uid("doc_file");
  var path = linkedType + "/" + linkedId + "/" + id + "_" + safeStorageName(file.name);
  return sb.storage.from("documents").upload(path, file, { contentType: file.type || "application/octet-stream" }).then(function(res){
    if (res.error){ sbRowError("upload document", res.error); return null; }
    var doc = {
      id: id, linkedType: linkedType, linkedId: linkedId,
      name: file.name, mimeType: file.type || "application/octet-stream", size: file.size,
      storagePath: path, uploadedAt: Date.now(), uploadedBy: getViewerName(),
      category: category||"", expiryDate: expiryDate||""
    };
    state.documents.unshift(doc);
    return sbInsert("documents", documentToRow(doc)).then(function(){
      maybeCreateStorageCheckTask();
      maybeCreateExpiryReminderTask(doc);
      return doc;
    });
  }).catch(function(err){
    console.error("upload document failed", err);
    toast('Could not upload "'+file.name+'" - check your connection and try again.');
    return null;
  });
}
function deleteDocumentRecord(id){
  var doc = null;
  for (var i=0;i<state.documents.length;i++){ if (state.documents[i].id === id){ doc = state.documents[i]; break; } }
  state.documents = state.documents.filter(function(d){ return d.id !== id; });
  sbDelete("documents", id);
  if (doc && doc.storagePath){
    sb.storage.from("documents").remove([doc.storagePath]).then(function(res){
      if (res.error) console.error("delete storage object failed", res.error);
    });
  }
}
// Lets the recruiter re-categorize a document (e.g. one dropped into "Other documents") or
// set/change its expiry date directly from the checklist row, without re-uploading the file.
function updateDocumentRecord(id, fields){
  var doc = null;
  for (var i=0;i<state.documents.length;i++){ if (state.documents[i].id === id){ doc = state.documents[i]; break; } }
  if (!doc) return;
  if (fields.category !== undefined) doc.category = fields.category || "";
  if (fields.expiryDate !== undefined) doc.expiryDate = fields.expiryDate || "";
  sbUpdate("documents", id, { category: doc.category||null, expiry_date: strOrNull(doc.expiryDate) });
  maybeCreateExpiryReminderTask(doc);
}
// Credentialing expiry reminders: when a doctor-linked document has an expiry date within
// EXPIRY_WARNING_DAYS (or already past), drop a one-off reminder task onto Home so it's actually
// noticed - mirrors maybeCreateStorageCheckTask()'s "dedupe by a stable linkedId" approach.
function maybeCreateExpiryReminderTask(doc){
  if (!doc || !doc.expiryDate || doc.linkedType !== "doctor") return;
  var today = todayISO();
  if (doc.expiryDate > addDaysISO(today, EXPIRY_WARNING_DAYS)) return;
  var taskLinkedId = "doc_expiry_" + doc.id + "_" + doc.expiryDate;
  var exists = state.tasks.some(function(t){ return t.linkedType === "document_expiry" && t.linkedId === taskLinkedId; });
  if (exists) return;
  var doctor = findDoctor(doc.linkedId);
  var catLabel = (CREDENTIALING_CATEGORY_MAP[doc.category]||{}).label || doc.category || "Document";
  var verb = doc.expiryDate < today ? "expired" : "expires";
  var t = {
    id: uid("task"),
    title: catLabel + " for " + (doctor ? doctor.name : "a doctor") + " " + verb + " " + fmtDate(doc.expiryDate),
    dueDate: today, done: false, linkedType: "document_expiry", linkedId: taskLinkedId, createdAt: Date.now()
  };
  state.tasks.unshift(t);
  sbInsert("tasks", taskToRow(t));
}
// Catches documents that already had an expiry date set before this reminder logic existed
// (or were written straight into Supabase) - run once after the initial data load.
function sweepDocumentExpiries(){
  state.documents.forEach(function(doc){ maybeCreateExpiryReminderTask(doc); });
}
function fmtFileSize(bytes){
  if (bytes === null || bytes === undefined || isNaN(bytes)) return "-";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}
function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(",");
  var mimeMatch = parts[0].match(/data:([^;]+);base64/);
  var mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
  var binary = atob(parts[1]);
  var bytes = new Uint8Array(binary.length);
  for (var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new Blob([bytes], { type: mime });
}
function fileKindIcon(mimeType){
  mimeType = mimeType || "";
  if (mimeType.indexOf("pdf") >= 0) return "📕";
  if (mimeType.indexOf("image") >= 0) return "🖼️";
  if (mimeType.indexOf("word") >= 0 || mimeType.indexOf("document") >= 0) return "📄";
  if (mimeType.indexOf("sheet") >= 0 || mimeType.indexOf("excel") >= 0 || mimeType.indexOf("csv") >= 0) return "📊";
  return "📎";
}
function toggleTask(id){
  var t = null;
  for (var i=0;i<state.tasks.length;i++){ if (state.tasks[i].id===id){ t = state.tasks[i]; break; } }
  if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : null;
  sbUpdate("tasks", id, { done: t.done, completed_at: t.completedAt ? new Date(t.completedAt).toISOString() : null });
}
function deleteTask(id){
  state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
  sbDelete("tasks", id);
}
// Every time documents load, check whether the total uploaded count has crossed another
// multiple of 50 (the free Supabase plan's storage sits at 1GB - see chat 2026-09-01) and,
// if so, drop a one-off reminder task onto Home so it's actually noticed rather than needing
// her to remember to check the Supabase dashboard herself. Fires again every +50 after that.
var STORAGE_CHECK_THRESHOLD = 50;
function maybeCreateStorageCheckTask(){
  var threshold = Math.floor((state.documents.length||0) / STORAGE_CHECK_THRESHOLD) * STORAGE_CHECK_THRESHOLD;
  if (threshold < STORAGE_CHECK_THRESHOLD) return;
  var checkId = "storage_check_" + threshold;
  var exists = state.tasks.some(function(t){ return t.linkedType === "system" && t.linkedId === checkId; });
  if (exists) return;
  var t = {
    id: uid("task"), title: "Check Supabase storage usage - you've uploaded " + threshold + "+ documents",
    dueDate: todayISO(), done: false, linkedType: "system", linkedId: checkId, createdAt: Date.now()
  };
  state.tasks.unshift(t);
  sbInsert("tasks", taskToRow(t));
}

/* ---------- Home ---------- */

function renderHome(){
  var today = todayISO();
  var viewDate = homeDate || today;
  var isToday = viewDate === today;

  // Today keeps its original rollup behaviour: every still-open task due today or earlier
  // (overdue included), plus anything ticked off today - so finishing a task doesn't make it
  // vanish, it just drops down crossed out for the rest of the day. Any other date is a precise
  // day view instead: tasks actually due that exact day, and tasks actually completed that exact
  // day - so completed tasks stay put on the day they were finished rather than disappearing once
  // "today" moves on, and you can browse back/forward to see what happened or is coming up.
  var list = state.tasks.filter(function(t){
    if (!t.done) return isToday ? t.dueDate <= viewDate : t.dueDate === viewDate;
    return t.completedAt && new Date(t.completedAt).toISOString().slice(0,10) === viewDate;
  }).sort(function(a,b){ return a.dueDate < b.dueDate ? -1 : 1; });

  var dateNav = '<div class="home-date-nav">'+
    '<button class="btn btn-sm btn-icon" type="button" data-action="home-date-prev" aria-label="Previous day">&larr;</button>'+
    '<input type="date" id="home-date-input" value="'+escapeHtml(viewDate)+'" />'+
    '<button class="btn btn-sm btn-icon" type="button" data-action="home-date-next" aria-label="Next day">&rarr;</button>'+
    (isToday ? '' : '<button class="btn btn-sm" type="button" data-action="home-date-today">Today</button>')+
  '</div>';

  var subLabel = isToday ? "Today's tasks" : (viewDate < today ? "Completed and due this day" : "Due this day");
  var html = '<div class="page-head"><div><h1>'+fmtDate(viewDate)+(isToday?' <span class="today-tag">Today</span>':'')+'</h1><div class="sub">'+subLabel+'</div></div><div>'+dateNav+'</div></div>';

  if (list.length === 0){
    var emptyMsg = isToday ? "Tasks you schedule from a doctor or hospital profile will show up here on the day they're due."
      : (viewDate < today ? "Nothing was due or completed on this day." : "Nothing is due on this day yet.");
    html += '<div class="empty"><h3>Nothing here</h3><p>'+emptyMsg+'</p></div>';
    return html;
  }

  html += '<div class="panel">' + taskListHtml(list, today) + '</div>';
  return html;
}

function taskRowHtml(t, today){
  var label = null, href = "#/home";
  if (t.linkedType === "doctor"){ var d = findDoctor(t.linkedId); if (d){ label = d.name; href = "#/doctors/"+d.id; } }
  else if (t.linkedType === "hospital"){ var h = findHospital(t.linkedId); if (h){ label = h.name; href = "#/hospitals/"+h.id; } }
  else if (t.linkedType === "client"){ var c = findClient(t.linkedId); if (c){ label = c.name; href = "#/clients/"+c.id; } }
  else if (t.linkedType === "placement"){ var pl = findPlacement(t.linkedId); if (pl){ var pd = findDoctor(pl.doctorId); label = pd ? pd.name : (pl.jobTitle||"Placement"); href = "#/placements/"+pl.id; } }
  var chipCls = t.dueDate < today ? "over" : (t.dueDate === today ? "today" : "");
  return '<div class="task-row'+(t.done?" done":"")+'">'+
    '<input type="checkbox" class="task-check" data-action="toggle-task" data-id="'+t.id+'" '+(t.done?"checked":"")+' />'+
    '<div class="task-body">'+
      '<div class="task-title">'+escapeHtml(t.title)+'</div>'+
      '<div class="task-meta"><span class="due-chip '+chipCls+'">'+fmtDate(t.dueDate)+'</span>'+
      (label ? '<a href="'+href+'">'+escapeHtml(label)+'</a>' : '')+
      '</div>'+
    '</div>'+
  '</div>';
}

function taskListHtml(list, today){
  var incomplete = list.filter(function(t){ return !t.done; });
  var completed = list.filter(function(t){ return t.done; });
  var html = '<div>';
  incomplete.forEach(function(t){ html += taskRowHtml(t, today); });
  if (completed.length){
    html += '<div class="task-completed-divider">Completed<span class="cnt">'+completed.length+'</span></div>';
    completed.forEach(function(t){ html += taskRowHtml(t, today); });
  }
  html += '</div>';
  return html;
}

function renderDoctorsList(){
  var f = uiFilters.doctors;
  var selCount = Object.keys(uiFilters.selectedDoctors).filter(function(k){return uiFilters.selectedDoctors[k];}).length;

  if (state.doctors.length === 0){
    var html = '<div class="page-head"><div><h1>Doctors</h1><div class="sub">0 total</div></div>'+
      '<button class="btn btn-primary" data-action="open-add-doctor" type="button">+ New doctor</button></div>';
    html += '<div class="empty"><h3>No doctors yet</h3><p>Add the first doctor you are placing.</p><button class="btn btn-primary" data-action="open-add-doctor" type="button">Add a doctor</button></div>';
    return html;
  }

  var list = state.doctors.filter(function(d){
    var loc = locationOf(d).toLowerCase();
    return (!f.name || (d.name||"").toLowerCase().indexOf(f.name.toLowerCase())>=0) &&
      (!f.mobile || (d.mobile||"").toLowerCase().indexOf(f.mobile.toLowerCase())>=0) &&
      (!f.specialty || (d.specialty||"").toLowerCase().indexOf(f.specialty.toLowerCase())>=0) &&
      (!f.location || loc.indexOf(f.location.toLowerCase())>=0) &&
      (!f.email || (d.email||"").toLowerCase().indexOf(f.email.toLowerCase())>=0) &&
      (!f.position || (d.position||"").toLowerCase().indexOf(f.position.toLowerCase())>=0) &&
      (!f.recruiter || (d.recruiter||"").toLowerCase().indexOf(f.recruiter.toLowerCase())>=0) &&
      (!f.source || (d.source||"").toLowerCase().indexOf(f.source.toLowerCase())>=0);
  });
  list.sort(function(a,b){
    var r = (a.name||"").localeCompare(b.name||"");
    return f.sortDir === "desc" ? -r : r;
  });

  var html = '<div class="page-head"><div><h1>Doctors</h1><div class="sub">'+filteredCountLabel(list.length, state.doctors.length)+'</div></div>'+
    '<button class="btn btn-primary" data-action="open-add-doctor" type="button">+ New doctor</button></div>';

  if (selCount > 0){
    html += '<div class="bulk-bar"><span class="count">'+selCount+' selected</span><span class="spacer"></span>'+
      '<button class="btn btn-sm btn-primary" type="button" data-action="bulk-email">Email selected</button>'+
      '<button class="btn btn-sm btn-danger" type="button" data-action="open-bulk-delete">Delete selected</button>'+
      '<button class="btn btn-sm btn-ghost" type="button" data-action="clear-selection">Clear</button></div>';
  }

  var pageSize = 100;
  var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  if (!f.page || f.page < 1) f.page = 1;
  if (f.page > totalPages) f.page = totalPages;
  var pageStart = (f.page - 1) * pageSize;
  var pageList = list.slice(pageStart, pageStart + pageSize);

  html += '<div class="table-wrap"><table><thead>'+
    '<tr>'+
      '<th class="checkcell"><input type="checkbox" id="doctors-select-all" title="Select all on this page" /></th>'+
      '<th class="checkcell"></th>'+
      '<th class="sortable '+(f.sortDir==="desc"?"desc":"")+'" data-action="sort-doctors">Name<span class="car"></span></th>'+
      '<th>Mobile</th><th>Email</th><th>Specialty</th><th>Location</th><th>Position</th><th>Recruiter</th><th>Source</th><th class="checkcell"></th>'+
    '</tr>'+
    '<tr class="filter-row">'+
      '<th></th><th></th>'+
      filterRowInput("name", f.name)+
      filterRowInput("mobile", f.mobile)+
      filterRowInput("email", f.email)+
      filterRowSelect("specialty", f.specialty, SPECIALTY_OPTIONS)+
      filterRowInput("location", f.location)+
      filterRowInput("position", f.position)+
      filterRowInput("recruiter", f.recruiter)+
      filterRowInput("source", f.source)+
      '<th></th>'+
    '</tr>'+
  '</thead><tbody>';

  if (pageList.length === 0){
    html += '<tr><td colspan="11"><div class="empty" style="border:none;background:none;">No matches.</div></td></tr>';
  } else {
    pageList.forEach(function(d){
      var checked = uiFilters.selectedDoctors[d.id] ? "checked" : "";
      html += '<tr data-action="open-doctor" data-id="'+d.id+'">'+
        '<td class="checkcell"><input type="checkbox" class="doctor-select" data-id="'+d.id+'" '+checked+' /></td>'+
        '<td class="checkcell"><button type="button" class="btn-icon" data-action="quick-view-doctor" data-id="'+d.id+'" title="Quick view" aria-label="Quick view '+escapeHtml(d.name)+'">&#128065;</button></td>'+
        '<td class="name">'+escapeHtml(d.name)+'</td>'+
        '<td>'+escapeHtml(d.mobile||"-")+'</td>'+
        '<td>'+escapeHtml(d.email||"-")+'</td>'+
        '<td>'+escapeHtml(d.specialty||"-")+'</td>'+
        '<td>'+escapeHtml(locationOf(d)||"-")+'</td>'+
        '<td>'+escapeHtml(d.position||"-")+'</td>'+
        '<td>'+escapeHtml(d.recruiter||"-")+'</td>'+
        '<td>'+escapeHtml(d.source||"-")+'</td>'+
        '<td class="checkcell"><button type="button" class="btn-icon btn-icon-danger" data-action="open-delete-doctor" data-id="'+d.id+'" title="Delete" aria-label="Delete '+escapeHtml(d.name)+'">&#128465;</button></td>'+
      '</tr>';
    });
  }
  html += '</tbody></table></div>';

  if (list.length > 0){
    var rangeStart = list.length === 0 ? 0 : pageStart + 1;
    var rangeEnd = Math.min(pageStart + pageSize, list.length);
    html += '<div class="pagination">'+
      '<button type="button" class="btn btn-sm" data-action="doctors-page-prev" '+(f.page<=1?"disabled":"")+'>&larr; Prev</button>'+
      '<span class="pagination-info">Showing '+rangeStart+'&ndash;'+rangeEnd+' of '+list.length+'</span>'+
      '<button type="button" class="btn btn-sm" data-action="doctors-page-next" '+(f.page>=totalPages?"disabled":"")+'>Next &rarr;</button>'+
    '</div>';
  }
  return html;
}

function doctorTabs(id, active){

function renderDoctorDetail(id, tab){
  var d = findDoctor(id);
  if (!d) return '<div class="empty"><h3>Doctor not found</h3><p>It may have been removed.</p></div>';
  tab = tab || "snapshot";

  var html = '<div class="detail-head">'+
    '<div class="detail-title"><h1>'+escapeHtml(d.name)+'</h1><div class="org-sub">'+escapeHtml(d.position||"")+(d.specialty?(" &middot; "+escapeHtml(d.specialty)):"")+'</div>'+
    '<div class="contact-line">'+
      (d.email ? '<a href="mailto:'+escapeHtml(d.email)+'">'+escapeHtml(d.email)+'</a>' : '')+
      (d.mobile ? '<a href="tel:'+escapeHtml(d.mobile)+'">'+escapeHtml(d.mobile)+'</a>' : '')+
    '</div></div>'+
    '<div class="action-row">'+
      '<button class="btn btn-primary" type="button" data-action="open-compose" data-linked="doctor" data-id="'+d.id+'">Email</button>'+
      '<button class="btn" type="button" data-action="open-edit-doctor" data-id="'+d.id+'">Edit</button>'+
      '<button class="btn btn-danger" type="button" data-action="open-delete-doctor" data-id="'+d.id+'">Delete</button>'+
    '</div>'+
  '</div>';

  html += doctorTabs(id, tab);

  if (tab === "placements"){
    html += renderDoctorPlacementsTab(d);
  } else if (tab === "notes"){
    html += renderNotesTab("doctor", d.id);
  } else if (tab === "documents"){
    html += renderDoctorCredentialingTab(d);

    html += renderDoctorSnapshotTab(d);

  return html;
}

// A single document row shared by the credentialing checklist and the "Other documents"
// fallback list - includes inline category/expiry editing since (unlike the generic
// renderDocumentsTab list used for hospitals/clients) these fields matter here.
function credentialDocRowHtml(doc){
  return '<div class="doc-row cred-doc-row">'+
    '<span class="doc-icon">'+fileKindIcon(doc.mimeType)+'</span>'+
    '<div class="doc-body">'+
      '<div class="doc-name">'+escapeHtml(doc.name)+'</div>'+
      '<div class="doc-meta">'+fmtFileSize(doc.size)+' &middot; uploaded '+fmtDateTime(doc.uploadedAt)+' by '+escapeHtml(doc.uploadedBy||"-")+'</div>'+
    '</div>'+
    '<div class="cred-doc-fields">'+
      '<label class="cred-inline-label">Category<select class="cred-category-select" data-id="'+doc.id+'">'+
        '<option value="">Uncategorized</option>'+
        CREDENTIALING_CATEGORY_LIST.map(function(c){ return '<option value="'+c.key+'" '+(doc.category===c.key?"selected":"")+'>'+escapeHtml(c.label)+'</option>'; }).join("")+
      '</select></label>'+
      '<label class="cred-inline-label">Expiry<input type="date" class="cred-expiry-input" data-id="'+doc.id+'" value="'+escapeHtml(doc.expiryDate||"")+'" /></label>'+
    '</div>'+
    (doc.mimeType && doc.mimeType.indexOf("image") === 0 ? '<button class="btn btn-sm" type="button" data-action="view-document" data-id="'+doc.id+'">View</button>' : '')+
    '<button class="btn btn-sm" type="button" data-action="download-document" data-id="'+doc.id+'">Download</button>'+
    '<button class="btn btn-sm btn-danger" type="button" data-action="delete-document" data-id="'+doc.id+'">Delete</button>'+
  '</div>';
}
function renderDoctorCredentialingTab(d){
  var captured = 0, expiredCount = 0, expiringCount = 0;
  var sectionsHtml = CREDENTIALING_SECTIONS.map(function(sec){
    var rowsHtml = sec.items.map(function(item){
      var docs = credentialDocsFor(d.id, item.key);
      var status = credentialCategoryStatus(docs);
      if (docs.length) captured++;
      if (status.label === "Expired") expiredCount++;
      else if (status.label === "Expiring soon") expiringCount++;
      var expandKey = d.id + ":" + item.key;
      var expanded = !!expandedCredentialCategories[expandKey];
      var inputId = "credential-upload-" + item.key + "-" + d.id;
      var rowHtml = '<div class="cred-row">'+
        '<button type="button" class="cred-row-head" data-action="toggle-credential-category" data-category="'+item.key+'" data-doctor="'+d.id+'">'+
          '<span class="cred-toggle-caret">'+(expanded?"&#9660;":"&#9654;")+'</span>'+
          '<span class="cred-label">'+escapeHtml(item.label)+'</span>'+
          badgeHtml(status.label, status.cls)+
          '<span class="cred-count">'+(docs.length ? (docs.length+" file"+(docs.length>1?"s":"")) : "")+'</span>'+
        '</button>'+
        '<label class="btn btn-sm cred-add-btn" for="'+inputId+'">+ Add</label>'+
        '<input type="file" id="'+inputId+'" class="credential-upload-input" data-doctor="'+d.id+'" data-category="'+item.key+'" multiple style="display:none;" />'+
      '</div>';
      if (expanded){
        rowHtml += '<div class="cred-row-files">'+
          (docs.length ? docs.map(credentialDocRowHtml).join("") : '<div class="empty" style="border:none;background:none;padding:6px 0 6px 34px;"><p>No files yet.</p></div>')+
        '</div>';
      }
      return rowHtml;
    }).join("");
    return '<div class="panel cred-section"><h2>'+escapeHtml(sec.section)+'</h2>'+rowsHtml+'</div>';
  }).join("");

  var total = CREDENTIALING_CATEGORY_LIST.length;
  var progressPct = total ? Math.round((captured/total)*100) : 0;
  var summaryHtml = '<div class="panel cred-summary">'+
    '<div class="cred-summary-top">'+
      '<div><strong>'+captured+' of '+total+'</strong> categories captured</div>'+
      '<button class="btn btn-primary btn-sm" type="button" data-action="open-bulk-upload-credentials" data-doctor="'+d.id+'">Bulk upload</button>'+
    '</div>'+
    '<div class="cred-progress-bar"><div class="cred-progress-fill" style="width:'+progressPct+'%;"></div></div>'+
    ((expiredCount||expiringCount) ? '<div class="cred-summary-flags">'+
      (expiredCount ? badgeHtml(expiredCount+" expired", "rust") : "")+
      (expiringCount ? badgeHtml(expiringCount+" expiring soon", "amberlight") : "")+
    '</div>' : "")+
  '</div>';

  var uncategorized = uncategorizedDoctorDocs(d.id);
  var otherHtml = '<div class="panel" style="margin-top:16px;"><h2>Other documents<span class="cnt">'+uncategorized.length+'</span></h2>'+
    '<label class="upload-zone" for="document-upload-input">'+
      '<div class="up-title">Drag files here or click to upload</div>'+
      '<div class="up-sub">For anything outside the checklist above. Each file '+fmtFileSize(MAX_DOCUMENT_BYTES)+' max.</div>'+
    '</label>'+
    '<input type="file" id="document-upload-input" data-linked-type="doctor" data-linked-id="'+d.id+'" multiple style="display:none;" />'+
    (uncategorized.length ? '<div class="doc-list" style="margin-top:12px;">'+uncategorized.map(credentialDocRowHtml).join("")+'</div>' : '')+
  '</div>';

  return summaryHtml + sectionsHtml + otherHtml;
}

function renderBulkCredentialFileList(){
  var box = document.getElementById("bulk-credential-file-list");

/* ---------- Placement detail ---------- */

function initials(name){
  if (!name) return "?";
  var parts = name.trim().split(/\s+/);
  var s = (parts[0][0] || "");
  if (parts.length > 1) s += parts[parts.length-1][0];
  return s.toUpperCase();
}

function fieldItemHtml(label, value, placementId, full){
  var v;
  if (value === null || value === undefined || value === ""){
    v = placementId ? '<button type="button" class="link-add" data-action="open-edit-placement" data-id="'+placementId+'">+ Add</button>' : '<span class="muted-dash">-</span>';
  } else {
    v = escapeHtml(value);
  }
  return '<div class="field-item'+(full?' full':'')+'"><label>'+escapeHtml(label)+'</label><div class="val">'+v+'</div></div>';
}
function fieldItemRaw(label, html, full){
  return '<div class="field-item'+(full?' full':'')+'"><label>'+escapeHtml(label)+'</label><div class="val">'+(html||'<span class="muted-dash">-</span>')+'</div></div>';
}
function panelHead(title, placementId){
  return '<h2>'+escapeHtml(title)+'<button type="button" class="btn-icon" data-action="open-edit-placement" data-id="'+placementId+'" title="Edit" aria-label="Edit '+escapeHtml(title)+'">&#9998;</button></h2>';
}

    '<a href="#/placements/'+id+'/timesheets" class="'+(active==="timesheets"?"active":"")+'">Timesheets</a>'+

function renderPlacementDetail(id, tab){
  var p = findPlacement(id);
  if (!p) return '<div class="empty"><h3>Placement not found</h3><p>It may have been removed.</p></div>';
  tab = tab || "details";
  var doc = findDoctor(p.doctorId), hosp = findHospital(p.hospitalId);
  var docName = doc ? doc.name : "Unknown candidate";
  var hospName = hosp ? hosp.name : "Unknown hospital";

  var html = '<div class="placement-view">';
  html += '<div class="placement-ribbon"><span>Placement</span></div>';
  html += '<div class="placement-main">';
  html += '<div class="placement-head">'+
    '<div class="avatar-circle">'+escapeHtml(initials(docName))+'</div>'+
    '<div class="placement-head-body">'+
      '<h1>'+escapeHtml(docName)+' at '+escapeHtml(hospName)+'</h1>'+
      '<div class="placement-chips">'+statusBadgeHtml(p.status)+(p.startDate?('<span class="due-chip">LAST PLACED '+fmtDate(p.startDate)+'</span>'):'')+'</div>'+
      '<div class="placement-idline mono">ID: '+escapeHtml(p.id)+
        (doc && doc.email ? ' &nbsp;&middot;&nbsp; <a href="mailto:'+escapeHtml(doc.email)+'">'+escapeHtml(doc.email)+'</a>' : '')+
      '</div>'+
    '</div>'+
    '<div class="placement-head-actions">'+
      '<button class="btn" type="button" data-action="open-edit-placement" data-id="'+p.id+'">Edit</button>'+
      '<button class="btn btn-danger" type="button" data-action="delete-placement" data-id="'+p.id+'">Delete</button>'+
    '</div>'+
  '</div>';

  html += placementTabs(id, tab);

  if (tab === "tasks"){ html += renderPlacementTasksTab(p); }
  else if (tab === "activity"){ html += renderNotesTab("placement", p.id); }
  else if (tab === "documents"){ html += renderPlacementDocumentsTab(p); }
  else if (tab === "audit"){ html += renderPlacementAuditTab(p); }
  else if (tab === "timesheets"){ html += renderPlacementTimesheetsTab(p); }
  else if (tab === "invoices"){ html += renderPlacementInvoicesTab(p); }
  else { html += renderPlacementDetailsTab(p, doc, hosp); }

  html += '</div></div>';
  return html;
}

function renderInvoicesList(){

  var html = '<div class="page-head"><div><h1>Invoices</h1><div class="sub">'+state.invoices.length+' total</div></div></div>';
  if (state.invoices.length === 0){
    html += '<div class="empty"><h3>No invoices yet</h3><p>Create doctor wage or agency fee invoices from a placement\'s Invoices tab.</p></div>';
    return html;
  }

  var list = state.invoices.filter(function(inv){
    var doc = findDoctor(inv.doctorId), hosp = findHospital(inv.hospitalId);
    var docName = (doc?doc.name:"").toLowerCase(), hospName = (hosp?hosp.name:"").toLowerCase();
    return (!f.invoiceNumber || (inv.invoiceNumber||"").toLowerCase().indexOf(f.invoiceNumber.toLowerCase())>=0) &&
      (!f.type || invoiceTypeLabel(inv.type)===f.type) &&
      (!f.candidate || docName.indexOf(f.candidate.toLowerCase())>=0) &&
      (!f.hospital || hospName.indexOf(f.hospital.toLowerCase())>=0) &&
      (!f.status || inv.status===f.status);
  });
  list.sort(function(a,b){
    var r = (a.issueDate||"") < (b.issueDate||"") ? -1 : ((a.issueDate||"") > (b.issueDate||"") ? 1 : (a.createdAt - b.createdAt));
    return f.sortDir === "desc" ? -r : r;
  });

  var pageSize = 100;
  var totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  if (!f.page || f.page < 1) f.page = 1;
  if (f.page > totalPages) f.page = totalPages;
  var pageStart = (f.page - 1) * pageSize;
  var pageList = list.slice(pageStart, pageStart + pageSize);

  html += '<div class="table-wrap"><table><thead>'+
    '<tr>'+
      '<th>Invoice #</th><th>Type</th><th>Candidate</th><th>Hospital</th>'+
      '<th class="sortable '+(f.sortDir==="desc"?"desc":"")+'" data-action="sort-invoices">Issue date<span class="car"></span></th>'+
      '<th>Status</th><th>Last sent</th><th>Total</th>'+
    '</tr>'+
    '<tr class="filter-row">'+
      filterRowInput("invoiceNumber", f.invoiceNumber)+
      filterRowSelect("type", f.type, INVOICE_TYPE_OPTIONS)+
      filterRowInput("candidate", f.candidate)+
      filterRowInput("hospital", f.hospital)+
      '<th></th>'+
      filterRowSelect("status", f.status, INVOICE_STATUSES)+
      '<th></th><th></th>'+
    '</tr>'+
  '</thead><tbody>';

  if (pageList.length === 0){
    html += '<tr><td colspan="8"><div class="empty" style="border:none;background:none;">No matches.</div></td></tr>';
  } else {
    pageList.forEach(function(inv){
      var doc = findDoctor(inv.doctorId), hosp = findHospital(inv.hospitalId);
      var lastSent = lastSentAtForInvoice(inv.id);
      html += '<tr data-action="open-invoice" data-id="'+inv.id+'" style="cursor:pointer;">'+
        '<td class="mono">'+escapeHtml(inv.invoiceNumber)+'</td>'+
        '<td>'+invoiceTypeLabel(inv.type)+'</td>'+
        '<td>'+escapeHtml(doc?doc.name:"-")+'</td>'+
        '<td>'+escapeHtml(hosp?hosp.name:"-")+'</td>'+
        '<td class="mono">'+fmtDate(inv.issueDate)+'</td>'+
        '<td>'+statusBadgeHtml(inv.status)+'</td>'+
        '<td class="mono">'+(lastSent?fmtDate(new Date(lastSent).toISOString().slice(0,10)):"-")+'</td>'+
        '<td class="mono">'+fmtMoney(invoiceTotal(inv))+'</td>'+
      '</tr>';
    });
  }
  html += '</tbody></table></div>';

  if (list.length > 0){
    var rangeStart = list.length === 0 ? 0 : pageStart + 1;

    '</div>';
  }
  return html;
}

  }

  return html;

/* ---------- modals ---------- */

function openModal(html, size){
  var existingOverlay = document.getElementById("modal-overlay");
  if (existingOverlay) existingOverlay.parentNode.removeChild(existingOverlay);
  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modal-overlay";
  var cls = size === "xl" ? " modal-xl" : (size ? " modal-wide" : "");
  overlay.innerHTML = '<div class="modal'+cls+'">'+html+'</div>';
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  var o = document.getElementById("modal-overlay");
  if (o) o.parentNode.removeChild(o);
}

function updateBulkPreview(){
  var previewBox = document.getElementById("bulk-preview");
  if (!previewBox) return;
  var overlay = document.getElementById("modal-overlay");
  var ids = overlay ? JSON.parse(overlay.getAttribute("data-ids")||"[]") : [];
  var kind = overlay ? (overlay.getAttribute("data-kind")||"doctor") : "doctor";
  var cfg = bulkKindConfig(kind);
  var first = ids.map(cfg.find).filter(function(r){ return r && r.email; })[0];
  var subject = document.getElementById("bulk-subject").value;
  var body = document.getElementById("bulk-body").value;
  if (!first){ previewBox.innerHTML = '<div class="muted">No recipient to preview.</div>'; return; }
  var tk = cfg.tokens(first);
  previewBox.innerHTML = '<div class="field-item"><label>Preview for '+escapeHtml(first.name)+'</label></div>'+
    '<div class="val" style="font-weight:600;margin-bottom:4px;">'+escapeHtml(replaceTokens(subject, tk))+'</div>'+
    '<div class="val" style="white-space:pre-wrap;">'+escapeHtml(replaceTokens(body, tk))+'</div>';
}

/* ---------- main render ---------- */

function render(){
  var app = document.getElementById("app");
  if (!authChecked){ app.innerHTML = loadingScreenHtml("Loading..."); return; }
  if (!currentUser){ app.innerHTML = loginScreenHtml(); return; }
  if (!dataLoaded){ app.innerHTML = loadingScreenHtml("Loading your data..."); return; }
  var route = currentRoute();
  var key = route[0] || "home";
  var body;
  if (key === "home" || key === ""){ body = renderHome(); key="home"; }
  else if (key === "doctors" && route[1]){ body = renderDoctorDetail(route[1], route[2]); }
  else if (key === "doctors"){ body = renderDoctorsList(); }
  else if (key === "hospitals" && route[1]){ body = renderHospitalDetail(route[1], route[2]); }
  else if (key === "hospitals"){ body = renderHospitalsList(); }
  else if (key === "clients" && route[1]){ body = renderClientDetail(route[1], route[2]); }
  else if (key === "clients"){ body = renderClientsList(); }
  else if (key === "jobs" && route[1]){ body = renderJobDetail(route[1]); }
  else if (key === "jobs"){ body = renderJobsList(); }
  else if (key === "placements" && route[1]){ body = renderPlacementDetail(route[1], route[2]); }
  else if (key === "placements"){ body = renderPlacementsList(); }
  else if (key === "timesheets" && route[1]){ body = renderTimesheetDetail(route[1]); }
  else if (key === "timesheets"){ body = renderTimesheetsList(); }
  else if (key === "invoices" && route[1]){ body = renderInvoiceDetail(route[1]); }
  else if (key === "invoices"){ body = renderInvoicesList(); }
  else if (key === "settings"){ body = renderSettings(); }
  else { body = renderHome(); key = "home"; }
  app.innerHTML = renderShell(body, key);
}

document.addEventListener("click", function(e){
  var menuBtn = document.getElementById("new-menu-btn");
  var menu = document.getElementById("new-menu");
  if (menuBtn && menu){
    if (e.target === menuBtn){ menu.classList.toggle("open"); return; }
    else if (!menu.contains(e.target)){ menu.classList.remove("open"); }
  }
  var results = document.getElementById("side-results");
  var searchInput = document.getElementById("side-search-input");
  if (results && searchInput && e.target !== searchInput && !results.contains(e.target)){

  if (e.target.classList && e.target.classList.contains("ts-notes")){

  }
  if (e.target.classList && e.target.classList.contains("cred-expiry-input")){
    updateDocumentRecord(e.target.getAttribute("data-id"), { expiryDate: e.target.value });
    persist();
    return;
  }
  if (e.target.id === "bulk-credential-file-input"){
    var bulkFiles = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";

  }
  if (e.target.classList && e.target.classList.contains("bulk-credential-category-select")){
