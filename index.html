    return;
  }
  if (e.target.classList && e.target.classList.contains("bulk-credential-expiry-input")){
    var beIdx = parseInt(e.target.getAttribute("data-index"),10);
    if (bulkCredentialFiles[beIdx]) bulkCredentialFiles[beIdx].expiryDate = e.target.value;
    return;
  }
  if (e.target.classList && e.target.classList.contains("credential-upload-input")){
    var credLinkedId = e.target.getAttribute("data-doctor"), credCategory = e.target.getAttribute("data-category");
    var credFiles = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    if (!credFiles.length) return;
    var credOversized = credFiles.filter(function(f){ return f.size > MAX_DOCUMENT_BYTES; });
    credFiles = credFiles.filter(function(f){ return f.size <= MAX_DOCUMENT_BYTES; });
    if (credOversized.length){
      toast(credOversized.length===1 ? '"'+credOversized[0].name+'" is over the '+fmtFileSize(MAX_DOCUMENT_BYTES)+' limit and was skipped.' : credOversized.length+' files were over the '+fmtFileSize(MAX_DOCUMENT_BYTES)+' limit and were skipped.');
    }
    if (!credFiles.length) return;
    toast(credFiles.length===1 ? "Uploading..." : "Uploading "+credFiles.length+" files...");
    Promise.all(credFiles.map(function(file){ return addDocumentRecord("doctor", credLinkedId, file, credCategory, ""); })).then(function(results){
      var okCount = results.filter(function(r){ return r; }).length;
      if (okCount) toast(okCount===1 ? "Document uploaded." : okCount+" documents uploaded.");
      persist();
    });
    return;
  }
  if (e.target.id === "signature-image-input"){
    var sigFile = (e.target.files && e.target.files[0]) || null;
    e.target.value = "";
    if (sigFile) insertSignatureImage(sigFile);
    return;
  }
  if (e.target.id === "document-upload-input"){
    var linkedTypeD = e.target.getAttribute("data-linked-type"), linkedIdD = e.target.getAttribute("data-linked-id");
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    var oversized = files.filter(function(f){ return f.size > MAX_DOCUMENT_BYTES; });
    files = files.filter(function(f){ return f.size <= MAX_DOCUMENT_BYTES; });
    if (oversized.length){
      toast(oversized.length===1 ? '"'+oversized[0].name+'" is over the '+fmtFileSize(MAX_DOCUMENT_BYTES)+' limit and was skipped.' : oversized.length+' files were over the '+fmtFileSize(MAX_DOCUMENT_BYTES)+' limit and were skipped.');
    }
    if (!files.length) return;
    toast(files.length===1 ? "Uploading..." : "Uploading "+files.length+" files...");
    Promise.all(files.map(function(file){ return addDocumentRecord(linkedTypeD, linkedIdD, file); })).then(function(results){
      var okCount = results.filter(function(r){ return r; }).length;
      if (okCount) toast(okCount===1 ? "Document uploaded." : okCount+" documents uploaded.");
      persist();
    });
    return;
  }
});

// Lets someone paste an image (e.g. copied from Finder/Explorer, a screenshot, or copied from
// another app) straight into the signature editor - falls through to the browser's normal paste
// behavior for plain text/formatted text, only intercepting when the clipboard actually carries
// an image.
document.addEventListener("paste", function(e){
  if (!e.target || e.target.id !== "signature-editor") return;
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < items.length; i++){
    if (items[i].type && items[i].type.indexOf("image/") === 0){
      var pastedFile = items[i].getAsFile();
      if (pastedFile){
        e.preventDefault();
        insertSignatureImage(pastedFile);
        return;
      }
    }
  }
});

document.addEventListener("input", function(e){
  if (e.target.id === "home-date-input"){
    if (e.target.value){ homeDate = e.target.value; render(); }
    return;
  }
  if (e.target.id === "side-search-input"){
    var matches = searchIndex(e.target.value);
    var box = document.getElementById("side-results");
    if (!e.target.value){ box.classList.remove("open"); return; }
    if (matches.length === 0){ box.innerHTML = '<div class="none">No matches.</div>'; }
    else { box.innerHTML = matches.map(function(m){ return '<a href="'+m.href+'">'+escapeHtml(m.label)+'<span class="kind">'+m.kind+'</span></a>'; }).join(""); }
    box.classList.add("open");
    return;
  }
  if (e.target.id === "bulk-subject" || e.target.id === "bulk-body"){ updateBulkPreview(); return; }
  if (e.target.getAttribute && e.target.getAttribute("data-combo-input")){
    var comboType = e.target.getAttribute("data-combo-input");
    var comboWrap = e.target.closest(".combo");
    if (!comboWrap) return;
    var menu = comboWrap.querySelector('[data-combo-menu="'+comboType+'"]');
    var hiddenInput = comboWrap.querySelector('[data-combo-hidden="'+comboType+'"]');
    var q = e.target.value;
    if (hiddenInput) hiddenInput.value = "";
    if (!q.trim()){ menu.hidden = true; menu.innerHTML = ""; return; }
    var results = comboType === "doctor" ? comboSearchDoctors(q) : (comboType === "hospital" ? comboSearchHospitals(q) : comboSearchLinked(q));
    menu.innerHTML = comboMenuHtml(results);
    menu.hidden = false;
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute("data-filter-field")){
    var field = e.target.getAttribute("data-filter-field");
    var route = currentRoute();
    var section = route[0];
    var bucket = uiFilters[section];
    if (!bucket) return;
    bucket[field] = e.target.value;
    if (Object.prototype.hasOwnProperty.call(bucket, "page")) bucket.page = 1;
    render();
    var el = document.querySelector('[data-filter-field="'+field+'"]');
    if (el){ el.focus(); var v = el.value; el.value=""; el.value=v; }
  }
});

    // current content is read straight off the DOM rather than through FormData.

    state.mySettings = { displayName: myDisplayName, sendFromEmail: mySendFromEmail, signatureHtml: mySignatureHtml };
